[project]
name = "tetrisrl"
version = "0.5.0"
description = "Tetris Reinforcement Learning Environment"
authors = [{name = "Jay Butera"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.0",
    "gymnasium>=1.2.1",
    "numpy>=2.2.6",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/jaybutera/tetrisRL"
Repository = "https://github.com/jaybutera/tetrisRL"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
